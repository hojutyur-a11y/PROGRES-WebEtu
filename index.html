<style>
:root{--bg:#f4f6f9;--surf:#fff;--ink:#0f172a;--mut:#64748b;--nav:#33334f;--grn:#009472;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:440px;height:100%;background:var(--surf);position:relative;display:flex;flex-direction:column}

.top{width:100%;max-width:375px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:10px;gap:8px}

.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center}
.wrap{position:relative;width:min(100%,375px);aspect-ratio:560/906;max-height:100%}

.hd{display:flex;align-items:center;gap:10px}

.pg{width:100%;max-width:375px;text-align:center;margin-top:30px}
.pg h1{font-size:22px}.pg p{color:var(--mut);line-height:1.8}
:root[data-theme="dark"]{--bg:#0b1118;--surf:#141c26;--ink:#e5eaf0;--mut:#94a3b8}
#home{padding:12px 24px 100px;overflow-y:auto;align-items:stretch}
.hh{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.hh h1{margin:0;font-size:26px;font-weight:900}

.hh svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn{height:92px;border-radius:14px;border:3px solid #efdc8f;background:linear-gradient(120deg,#2f8f86,#4aa79c 55%,#2a7f78);box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#f6d86a;font-weight:900;overflow:hidden}
.bn b{display:block;font-size:19px;line-height:1.2}.bn big{display:block;font-size:22px;color:#fff;letter-spacing:-1px;direction:ltr;text-align:right}

.dots{display:flex;justify-content:center;gap:10px;margin:14px 0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:0;background:var(--grn);color:#fff;font:700 13.5px Cairo,sans-serif;border-radius:10px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .15s,filter .15s}
.tile:active{transform:scale(.96);filter:brightness(.9)}
.tile svg{width:22px;height:22px;fill:currentColor;stroke:none}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block}
img.bn{display:block;width:100%;height:auto;padding:0;border:0;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
nav{z-index:60}
.rows{margin-top:14px;display:flex;flex-direction:column;gap:8px;text-align:right}
.rows>div{display:flex;justify-content:space-between;gap:12px;background:var(--bg);border-radius:12px;padding:11px 14px;font-size:13.5px}
.rows span{color:var(--mut)}.rows b{font-weight:800}
.rows .em{justify-content:center;color:var(--mut);padding:36px 14px}
#sheet{position:absolute;inset:0;z-index:70;background:var(--surf);padding:0 0 24px;transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,1,.36,1);overflow-y:auto;visibility:hidden}
#sheet.on{transform:none;visibility:visible}
.sh{display:flex;align-items:center;justify-content:center;position:relative;background:var(--grn);color:#fff;height:68px;padding-top:env(safe-area-inset-top,0px)}#shB{padding:0 20px;margin-top:18px}.tabs{display:flex;justify-content:center;gap:24px}.tg{background:var(--grn);display:flex;justify-content:center;gap:24px;padding:0 0 20px}.tg button{font:700 19px Cairo,sans-serif;color:#fff;background:transparent;border:3px solid #fff;border-radius:99px;padding:6px 30px;cursor:pointer;transition:.2s}.tg button.on{background:#fff;color:#009472}.days{display:flex;direction:ltr;gap:12px;overflow-x:auto;scrollbar-width:none;padding:20px 28px;background:var(--surf);box-shadow:0 4px 8px rgba(0,0,0,.08);position:relative;z-index:1}.days::-webkit-scrollbar{display:none}.rg{position:relative;overflow:hidden;border-radius:26px;padding:26px 26px 28px;color:#fff;background:linear-gradient(135deg,#00906c,#00d8a8);box-shadow:0 10px 22px rgba(0,148,114,.3);margin-top:6px}.rg:before{content:"";position:absolute;top:-70px;left:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}.rg:after{content:"";position:absolute;bottom:-60px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}.rg>*{position:relative;z-index:1}.rg .chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);padding:6px 18px;border-radius:99px;font-weight:800;font-size:15px;direction:ltr}.rg svg,.ph2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.rg .tt{display:flex;align-items:center;gap:12px;margin-top:14px}.rg .tt b{font-size:22px;font-weight:900}.rg .bd2{background:rgba(255,255,255,.2);border-radius:10px;padding:3px 14px;font-weight:800;font-size:14px;direction:ltr}.rg .sb{opacity:.75;margin-top:4px;font-size:16px}.rg hr{border:0;border-top:1px solid rgba(255,255,255,.25);margin:16px 0}.rg .ln{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px}.rg .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}.rg .pl{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border-radius:99px;padding:10px 18px;margin-top:12px;font-weight:700;font-size:15px}.ph2{display:flex;align-items:center;gap:12px;margin:30px 0 16px;font-size:20px;font-weight:900;color:var(--mut)}.ph2 i{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}.pv{min-height:340px;display:flex;align-items:center;justify-content:center;background:var(--surf);border:1px solid #e5e7eb;border-right:5px solid #3b82f6;border-radius:18px;padding:26px 20px;text-align:center;color:var(--mut);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}.days button{flex:none;font:700 18px Cairo,sans-serif;color:var(--mut);background:var(--surf);border:1.5px solid #e5e7eb;border-radius:99px;padding:8px 28px;cursor:pointer;transition:.2s}.days button.on{background:var(--grn);color:#fff;border-color:var(--grn)}.nod{text-align:center;margin-top:120px;color:#6b7280;font-size:19px;font-weight:700}.nod svg{width:108px;height:108px;display:block;margin:0 auto 20px;fill:#6b7280}.tabs button{font:700 19px Cairo,sans-serif;color:#009472;background:#eafcf5;border:3px solid #009472;border-radius:99px;padding:6px 30px;cursor:pointer;transition:.2s}.tabs button.on{background:#009472;color:#fff}.emp{text-align:center;margin-top:34px}.emp svg{width:100%;max-width:360px;height:auto}.emp h3{margin:18px 0 0;font-size:21px;font-weight:900}#sheet.wm::after{content:"";position:absolute;left:0;right:0;top:68px;bottom:0;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='330' height='170'><text x='0' y='100' transform='rotate(-20 165 85)' font-size='15' font-family='Arial' fill='%23888' fill-opacity='.3'>UN1902202624253553...</text></svg>")}.sv{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}.svc{border:0;border-radius:26px;aspect-ratio:4/5;padding:16px;color:#fff;font-family:Cairo,sans-serif;text-align:right;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.14);transition:transform .15s}.svc:active{transform:scale(.97)}.svc i{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center}.svc svg{width:28px;height:28px;fill:#fff}.svc b{font-size:16px;font-weight:900;margin-top:auto}.svc small{font-size:13px;line-height:1.5;opacity:.9;margin-top:10px;text-align:right}
.sh h2{margin:0;font-size:20px;font-weight:900}
.sh button{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));border:0;background:rgba(255,255,255,.22);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.wrap{perspective:1500px;touch-action:none}.card{transform-origin:50% 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:none;will-change:transform;cursor:grab}
#acc{padding:0 0 100px;overflow-y:auto;align-items:stretch;background:var(--bg)}
.ah{background:var(--surf);border-radius:0 0 34px 34px;box-shadow:0 8px 20px rgba(0,0,0,.08);padding:30px 0 30px;text-align:center}
.ah img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);display:block;margin:0 auto 14px}
.ah h1{margin:0;font-size:27px;font-weight:900}
.sec{padding:0 18px;margin-top:22px}.sec h4{margin:0 6px 8px;font-size:13px;color:var(--mut);font-weight:700}
.crd{background:var(--surf);border-radius:20px;box-shadow:0 3px 14px rgba(0,0,0,.07);padding:4px 16px}
.ri{display:flex;align-items:center;gap:14px;padding:13px 0}.ri+.ri{border-top:1px solid var(--bg)}
.ri .ico{width:30px;height:30px;color:#009472;flex:none}.ri .ico svg,.seg svg,.lo svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ri .tx small{display:block;color:var(--mut);font-size:13px}.ri .tx b{font-size:16px;font-weight:800}
.chv{margin-inline-start:auto;color:var(--mut);font-size:22px;line-height:1}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;color:var(--mut);font:800 13px Cairo,sans-serif;min-width:38px;height:34px;padding:0 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.seg button svg{width:18px;height:18px}.seg button.on{background:#009472;color:#fff}
.lo{margin:20px 18px 0;width:calc(100% - 36px);height:56px;border:0;border-radius:16px;background:#ef5350;color:#fff;font:800 17px Cairo,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}.lo svg{width:20px;height:20px}
html[dir=ltr] .sh button{right:auto;left:16px}html[dir=ltr] .rows,html[dir=ltr] .svc,html[dir=ltr] .svc small{text-align:left}
.em2{text-align:center;margin-top:150px}.ci{width:96px;height:96px;border-radius:50%;background:#17907d;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}.ci svg{width:50px;height:50px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.em2 h3{margin:0;font-size:20px;font-weight:900}.em2 p{margin:10px 24px 0;color:var(--mut);font-size:14px;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .emp g{fill:#8f8f8f}:root:not([data-theme="light"]) .tabs button:not(.on){background:rgba(0,148,114,.12);color:#1aa37f}}
:root[data-theme="dark"] .emp g{fill:#8f8f8f}:root[data-theme="dark"] .tabs button:not(.on){background:rgba(0,148,114,.12);color:#1aa37f}
:root[data-theme="light"] .emp g{fill:#e6e6e6}

.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:14px;-webkit-overflow-scrolling:touch}
.sl::-webkit-scrollbar{display:none}
.sl .s{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.uc{aspect-ratio:620/199;background:linear-gradient(120deg,#12806a,#1a9a82);border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;gap:16px;padding:0 20px;color:#fff}
.uc .ul{width:28%;max-width:110px;aspect-ratio:1;background:#d9d9d9;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.uc .ul img{width:86%;height:86%;object-fit:contain}.uc .ul svg{width:60%;height:60%;fill:none;stroke:#12806a;stroke-width:1.6;stroke-linejoin:round}
.uc .ut{flex:1;min-width:0}.uc .ut b{display:block;font-size:20px;font-weight:800}.uc .ut small{display:block;margin-top:8px;font-size:15px;opacity:.75;overflow-wrap:anywhere}
.dots i:first-child{width:16px;background:#cbd5e1}.dots i.on{width:30px;background:var(--grn)}.dots i{transition:width .25s}
#out{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#out.on{display:flex}#out h2{margin:0;font-size:22px}#out button{border:0;border-radius:14px;background:var(--grn);color:#fff;font:800 16px Cairo,sans-serif;padding:14px 36px;cursor:pointer}

/* Responsive phone layout */
html,body{width:100%;min-width:0;min-height:100%;overscroll-behavior:none}
body{min-height:100dvh}
.app{width:100%;height:100dvh;min-height:0;min-width:0;overflow:hidden}
.view{min-width:0;min-height:0;width:100%}
.stage{min-width:0;min-height:0;overflow:hidden}
.wrap{flex:none}
.cv{scale:var(--card-scale,1)}
#home,#acc{min-height:0;overscroll-behavior:contain}
#home{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#acc{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#sheet{max-width:100%;overscroll-behavior:contain}
img,svg{max-width:100%}
@media (max-height:620px){
  .view{padding-top:8px}
  #home{padding-top:8px}
  nav{height:58px;bottom:calc(5px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:360px){
  #home{padding-left:14px;padding-right:14px}
  .tile{font-size:12px}
  .hh h1{font-size:23px}
  .wrap{max-width:100%}
}

</style>

function scale(){
  const stage=document.querySelector("#cards .stage");
  const w=document.getElementById("wrap");
  if(!stage||!w)return;
  const availableW=Math.max(1,stage.clientWidth);
  const availableH=Math.max(1,stage.clientHeight);
  const fit=Math.min(1,availableW/375,availableH/555);
  w.style.setProperty("--card-scale",String(fit));
}
